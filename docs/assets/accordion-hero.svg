<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="bellowsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="25%" stop-color="#334155" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="75%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="goldKey" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle grid pattern -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="200" y1="0" x2="200" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="800" y1="0" x2="800" y2="420" />
    <line x1="1000" y1="0" x2="1000" y2="420" />
  </g>

  <!-- Decorative sound waves -->
  <path d="M 50 350 Q 150 280 250 350 T 450 350 T 650 350 T 850 350 T 1050 350 T 1180 350" fill="none" stroke="#0ea5e9" stroke-width="2" opacity="0.3" />
  <path d="M 50 360 Q 150 240 250 360 T 450 360 T 650 360 T 850 360 T 1050 360 T 1180 360" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.25" />

  <!-- Bellows Graphic (Center-Left) -->
  <g transform="translate(100, 110)">
    <!-- Accordion Bass Section -->
    <rect x="0" y="20" width="70" height="200" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <!-- Bass Buttons -->
    <circle cx="25" cy="50" r="5" fill="#94a3b8" />
    <circle cx="45" cy="65" r="5" fill="#38bdf8" filter="url(#neonBlur)" />
    <circle cx="25" cy="80" r="5" fill="#94a3b8" />
    <circle cx="45" cy="95" r="6" fill="#34d399" filter="url(#neonBlur)" />
    <circle cx="25" cy="110" r="5" fill="#94a3b8" />
    <circle cx="45" cy="125" r="5" fill="#94a3b8" />
    <circle cx="25" cy="140" r="5" fill="#94a3b8" />
    <circle cx="45" cy="155" r="5" fill="#94a3b8" />
    <circle cx="25" cy="170" r="5" fill="#94a3b8" />
    <circle cx="45" cy="185" r="5" fill="#94a3b8" />

    <!-- Accordion Pleated Bellows -->
    <path d="M 70 30 L 90 10 L 110 30 L 130 10 L 150 30 L 170 10 L 190 30 L 210 10 L 230 30 L 230 210 L 210 230 L 190 210 L 170 230 L 150 210 L 130 230 L 110 210 L 90 230 L 70 210 Z" fill="url(#bellowsGrad)" stroke="#475569" stroke-width="1.5" />
    
    <!-- Bellows Fold Accents -->
    <line x1="90" y1="10" x2="90" y2="230" stroke="#0284c7" stroke-width="1.5" opacity="0.7" />
    <line x1="130" y1="10" x2="130" y2="230" stroke="#0284c7" stroke-width="1.5" opacity="0.7" />
    <line x1="170" y1="10" x2="170" y2="230" stroke="#0284c7" stroke-width="1.5" opacity="0.7" />
    <line x1="210" y1="10" x2="210" y2="230" stroke="#0284c7" stroke-width="1.5" opacity="0.7" />

    <!-- Treble Keyboard Body -->
    <rect x="230" y="20" width="120" height="200" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    
    <!-- White Keys -->
    <rect x="250" y="30" width="90" height="24" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <rect x="250" y="56" width="90" height="24" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <rect x="250" y="82" width="90" height="24" rx="3" fill="url(#goldKey)" stroke="#ca8a04" stroke-width="2" filter="url(#neonBlur)" />
    <rect x="250" y="108" width="90" height="24" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <rect x="250" y="134" width="90" height="24" rx="3" fill="#38bdf8" stroke="#0284c7" stroke-width="2" filter="url(#neonBlur)" />
    <rect x="250" y="160" width="90" height="24" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <rect x="250" y="186" width="90" height="24" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />

    <!-- Black Keys -->
    <rect x="250" y="48" width="55" height="15" rx="2" fill="#1e293b" />
    <rect x="250" y="74" width="55" height="15" rx="2" fill="#1e293b" />
    <rect x="250" y="126" width="55" height="15" rx="2" fill="#1e293b" />
    <rect x="250" y="152" width="55" height="15" rx="2" fill="#1e293b" />
    <rect x="250" y="178" width="55" height="15" rx="2" fill="#1e293b" />

    <!-- AR Target Overlays -->
    <!-- Corner brackets -->
    <path d="M 240 15 L 240 5 L 255 5" fill="none" stroke="#22d3ee" stroke-width="3" />
    <path d="M 355 5 L 370 5 L 370 20" fill="none" stroke="#22d3ee" stroke-width="3" />
    <path d="M 370 225 L 370 240 L 355 240" fill="none" stroke="#22d3ee" stroke-width="3" />
    <path d="M 255 240 L 240 240 L 240 225" fill="none" stroke="#22d3ee" stroke-width="3" />
    
    <!-- AR Finger number hologram -->
    <circle cx="315" cy="94" r="11" fill="#0284c7" stroke="#ffffff" stroke-width="1.5" filter="url(#neonBlur)" />
    <text x="315" y="98" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">1</text>

    <circle cx="315" cy="146" r="11" fill="#10b981" stroke="#ffffff" stroke-width="1.5" filter="url(#neonBlur)" />
    <text x="315" y="150" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">3</text>
  </g>

  <!-- Typography & App Title -->
  <g transform="translate(530, 115)">
    <!-- Badge -->
    <rect x="0" y="0" width="220" height="32" rx="16" fill="rgba(56, 189, 248, 0.15)" stroke="#0284c7" stroke-width="1" />
    <circle cx="16" cy="16" r="5" fill="#34d399" />
    <text x="30" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">REAL-TIME PWA TRAINER</text>

    <!-- Main Title -->
    <text x="0" y="80" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="900" letter-spacing="-1">
      Accordion AR Trainer
    </text>

    <!-- Subtitle -->
    <text x="0" y="120" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400">
      Master Piano, Chromatic &amp; Diatonic Accordions with AR Camera
    </text>
    <text x="0" y="146" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400">
      Key Tracking, Acoustic Pitch Detection &amp; Waterfall Practice
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 185)">
      <!-- Pill 1: AR Tracking -->
      <rect x="0" y="0" width="130" height="34" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="65" y="22" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">📸 AR Key Vision</text>

      <!-- Pill 2: Pitch Detection -->
      <rect x="140" y="0" width="145" height="34" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1" />
      <text x="212" y="22" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">🎙️ Acoustic Pitch</text>

      <!-- Pill 3: Offline PWA -->
      <rect x="295" y="0" width="130" height="34" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1" />
      <text x="360" y="22" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">⚡ 100% Offline</text>

      <!-- Pill 4: Multi-Model -->
      <rect x="435" y="0" width="165" height="34" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
      <text x="517" y="22" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">🎹 Piano / CBA / GCF</text>
    </g>
  </g>
</svg>
